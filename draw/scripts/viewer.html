<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__BOARD_NAME__ — draw</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #212529; background: #fff; }
  #bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #dee2e6; background: #f8f9fa; box-sizing: border-box; }
  #bar .name { font-weight: 600; white-space: nowrap; }
  #bar .status { color: #868e96; white-space: nowrap; min-width: 140px; }
  #bar .status.busy { color: #f08c00; }
  #bar .status.bad { color: #e03131; }
  #bar .status.agent { color: #2f9e44; }
  #bar input { flex: 1; min-width: 160px; height: 28px; border: 1px solid #ced4da; border-radius: 6px; padding: 0 10px; font: inherit; }
  #bar button { height: 28px; border: 1px solid #ced4da; border-radius: 6px; background: #fff; padding: 0 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  #bar button.primary { background: #1e1e1e; color: #fff; border-color: #1e1e1e; }
  #bar button:disabled { opacity: .5; cursor: default; }
  #app { height: calc(100% - 44px); }
  #toast { position: fixed; right: 14px; bottom: 14px; background: #1e1e1e; color: #fff; padding: 8px 12px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 60vw; }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
<div id="bar">
  <span class="name">__BOARD_NAME__</span>
  <span id="status" class="status">loading…</span>
  <input id="note" placeholder="tell the agent what you drew, or ask it something… (Ctrl/Cmd+Enter sends)">
  <button id="export">Export PNG</button>
  <button id="send" class="primary">Send to Claude</button>
</div>
<div id="app"></div>
<div id="toast"></div>

<script src="__REACT_SRC__"></script>
<script src="__REACT_DOM_SRC__"></script>
<script>window.EXCALIDRAW_ASSET_PATH = "__ASSET_BASE__";</script>
<script src="__EXCALIDRAW_SRC__"></script>
<script>
(function () {
  const STAY = __STAY__;
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status"), toastEl = $("toast");
  let api = null, baseRev = null, lastFp = "", saveTimer = null, saving = false, offline = false, sentAt = 0;

  const setStatus = (text, cls) => { statusEl.textContent = text; statusEl.className = "status " + (cls || ""); };
  let toastTimer = null;
  const toast = (text) => { toastEl.textContent = text; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3500); };
  const fingerprint = (els) => els.map(e => e.id + ":" + e.version + ":" + (e.isDeleted ? 1 : 0)).join("|");
  const restore = (els) => ExcalidrawLib.restoreElements(els || [], null, { repairBindings: true });

  async function fetchScene() {
    const r = await fetch("/api/scene", { cache: "no-store" });
    if (!r.ok) throw new Error("scene " + r.status);
    return r.json();
  }

  // File elements win when the page has never seen the id or the file's version is newer;
  // otherwise the page's copy (possibly unsaved) wins. Local-only elements are kept.
  function merge(fileEls) {
    const local = api.getSceneElementsIncludingDeleted();
    const byId = new Map(local.map(e => [e.id, e]));
    const seen = new Set();
    const merged = [];
    let changed = 0;
    for (const f of restore(fileEls)) {
      seen.add(f.id);
      const l = byId.get(f.id);
      if (!l) { merged.push(f); changed++; }
      else if ((f.version || 0) > (l.version || 0)) { merged.push(f); changed++; }
      else merged.push(l);
    }
    for (const l of local) if (!seen.has(l.id)) merged.push(l);
    if (changed) api.updateScene({ elements: merged });
    return changed;
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 600);
  }

  async function save() {
    if (!api || saving) { if (saving) scheduleSave(); return; }
    const els = api.getSceneElementsIncludingDeleted();
    const fp = fingerprint(els);
    if (fp === lastFp) return;
    saving = true;
    setStatus("saving…", "busy");
    try {
      const json = ExcalidrawLib.serializeAsJSON(els, api.getAppState(), api.getFiles(), "local");
      const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ baseRev, scene: JSON.parse(json) }) });
      if (r.status === 409) {                    // the agent wrote meanwhile: merge, then retry
        const d = await r.json();
        baseRev = d.rev;
        const n = merge(d.scene.elements);
        if (n) toast("the agent drew " + n + " change" + (n === 1 ? "" : "s") + " — merged");
        saving = false;
        scheduleSave();
        return;
      }
      if (!r.ok) throw new Error("save " + r.status);
      const d = await r.json();
      baseRev = d.rev;
      lastFp = fp;
      offline = false;
      setStatus("saved", "");
    } catch (e) {
      offline = true;
      setStatus(sentAt ? "waiting for the agent…" : "server unreachable — edits kept in this tab", "bad");
      setTimeout(scheduleSave, 2000);
    } finally {
      saving = false;
    }
  }

  async function pollLoop() {
    for (;;) {
      try {
        const r = await fetch("/api/poll?rev=" + encodeURIComponent(baseRev || ""), { cache: "no-store" });
        if (!r.ok) throw new Error("poll " + r.status);
        const d = await r.json();
        if (offline) { offline = false; setStatus("reconnected", "agent"); }
        if (d.rev !== baseRev && !saving) {
          const s = await fetchScene();
          baseRev = s.rev;
          const n = merge(s.scene.elements);
          lastFp = fingerprint(api.getSceneElementsIncludingDeleted());
          if (n) { toast("the agent drew " + n + " change" + (n === 1 ? "" : "s")); setStatus("agent updated the board", "agent"); sentAt = 0; }
        }
      } catch (e) {
        offline = true;
        setStatus(sentAt ? "waiting for the agent…" : "server unreachable — edits kept in this tab", "bad");
        await new Promise(res => setTimeout(res, 2000));
      }
    }
  }

  async function exportImages() {
    const elements = api.getSceneElements();
    const appState = Object.assign({}, api.getAppState(), { exportBackground: true, exportWithDarkMode: false, viewBackgroundColor: "#ffffff" });
    const files = api.getFiles();
    const blob = await ExcalidrawLib.exportToBlob({ elements, appState, files, mimeType: "image/png", exportPadding: 24, quality: 1 });
    const png = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
    let svg = null;
    try { const el = await ExcalidrawLib.exportToSvg({ elements, appState, files, exportPadding: 24 }); svg = el.outerHTML; } catch (e) { /* svg is optional */ }
    return { png, svg };
  }

  async function send() {
    const btn = $("send");
    btn.disabled = true;
    setStatus("exporting…", "busy");
    try {
      clearTimeout(saveTimer);
      await save();
      const imgs = await exportImages();
      const note = $("note").value;
      const r = await fetch("/api/send", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ note }, imgs)) });
      if (!r.ok) throw new Error("send " + r.status);
      const d = await r.json();
      $("note").value = "";
      sentAt = Date.now();
      toast("sent" + (d.png ? " · " + d.png.split("/").pop() + " written" : ""));
      setStatus(d.exiting ? "sent — waiting for the agent…" : "sent", "agent");
    } catch (e) {
      setStatus("send failed: " + e.message, "bad");
    } finally {
      btn.disabled = false;
    }
  }

  async function exportOnly() {
    setStatus("exporting…", "busy");
    try {
      const imgs = await exportImages();
      const r = await fetch("/api/export", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(imgs) });
      const d = await r.json();
      toast("wrote " + [d.png, d.svg].filter(Boolean).map(p => p.split("/").pop()).join(" and "));
      setStatus("saved", "");
    } catch (e) { setStatus("export failed: " + e.message, "bad"); }
  }

  $("send").onclick = send;
  $("export").onclick = exportOnly;
  $("note").addEventListener("keydown", (ev) => { if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") send(); });
  window.addEventListener("beforeunload", () => {
    if (!api) return;
    const els = api.getSceneElementsIncludingDeleted();
    if (fingerprint(els) === lastFp) return;
    const json = ExcalidrawLib.serializeAsJSON(els, api.getAppState(), api.getFiles(), "local");
    navigator.sendBeacon("/api/save", new Blob([JSON.stringify({ baseRev: null, scene: JSON.parse(json) })], { type: "application/json" }));
  });

  const e = React.createElement;
  function App() {
    const [initial, setInitial] = React.useState(null);
    React.useEffect(() => {
      fetchScene().then((s) => {
        baseRev = s.rev;
        const els = restore(s.scene.elements);
        lastFp = fingerprint(els);
        setInitial({ elements: els, appState: { viewBackgroundColor: (s.scene.appState || {}).viewBackgroundColor || "#ffffff", gridSize: null }, files: s.scene.files || {}, scrollToContent: true });
        setStatus("saved", "");
      }).catch((err) => setStatus("cannot load: " + err.message, "bad"));
    }, []);
    if (!initial) return e("div", { style: { padding: 20, color: "#868e96" } }, "loading board…");
    return e(ExcalidrawLib.Excalidraw, {
      initialData: initial,
      excalidrawAPI: (a) => { api = a; window.__draw_api = a; window.__draw_ready = true; pollLoop(); },
      onChange: () => { if (api) scheduleSave(); },
      name: "__BOARD_NAME__",
      UIOptions: { canvasActions: { loadScene: false, saveToActiveFile: false, clearCanvas: false } },
    });
  }
  ReactDOM.createRoot($("app")).render(e(App));
})();
</script>
</body>
</html>
